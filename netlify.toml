# Site estático: publica a raiz do repositório, sem etapa de build.
[build]
  publish = "."
  command = ""

# Arquivos internos do projeto não ficam públicos no endereço do site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/"
  status = 404
  force = true
